name: Golden Pilot Regression Guard

on:
  push:
    branches: [main]
    paths:
      - 'data/production/**'
      - 'data/releases/**'
      - 'staging/review_queue/**'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
  pull_request:
    branches: [main]
    paths:
      - 'data/production/**'
      - 'data/releases/**'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:

jobs:
  full-test-suite:
    name: Full Test Suite (123 tests, no LLM calls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install pytest pyyaml requests pykakasi janome
      - name: Run complete test suite
        # All 111 tests operate on frozen data — zero live LLM calls required.
        # test_linguistic_validation.py checks model-name strings in production records.
        # test_phase1_1c.py checks Golden Pilot invariants and known-bad pattern absence.
        # No GEMINI_API_KEY is needed or used.
        run: pytest tests/ -v --tb=short
        env:
          SKIP_LLM_CALLS: "1"

  invariant-check:
    name: Dataset Invariants (11 invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install pyyaml requests
      - name: Run dataset invariant checks
        # Exits 0 if all hard invariants pass (known Phase 1.2 backlog items are warnings only).
        run: python scripts/check_dataset_invariants.py

  golden-pilot-hash:
    name: Golden Pilot Hash Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Golden Pilot SHA-256
        # Verifies both the vocabulary file SHA-256 and the canonical (content) SHA-256.
        # Canonical algorithm: sorted by id, status excluded, one JSON line per record,
        # incremental SHA-256 update — mirrors compute_canonical_dataset_hash() in run_phase1_1c.py.
        run: |
          python - <<'EOF'
          import json, hashlib, sys
          from pathlib import Path

          base = Path(".")
          manifest_path = base / "data/releases/golden-pilot-v1/dataset_manifest.json"
          vocab_path    = base / "data/releases/golden-pilot-v1/vocabulary.jsonl"

          if not manifest_path.exists() or not vocab_path.exists():
              print("Golden Pilot not yet frozen — SKIP")
              sys.exit(0)

          with open(manifest_path) as f:
              manifest = json.load(f)

          # ── File SHA-256 ────────────────────────────────────────────────────
          h = hashlib.sha256()
          with open(vocab_path, "rb") as f:
              for chunk in iter(lambda: f.read(65536), b""):
                  h.update(chunk)
          computed_file = h.hexdigest()
          expected_file = manifest["vocabulary_file_sha256"]
          if computed_file != expected_file:
              print(f"FAIL: file SHA-256 mismatch\n  computed={computed_file}\n  expected={expected_file}")
              sys.exit(1)

          # ── Canonical SHA-256 ───────────────────────────────────────────────
          # Must mirror compute_canonical_dataset_hash() in scripts/run_phase1_1c.py exactly.
          records = [json.loads(l) for l in open(vocab_path) if l.strip()]
          sorted_records = sorted(records, key=lambda r: r.get("id", ""))
          ch = hashlib.sha256()
          for r in sorted_records:
              canonical = {k: v for k, v in r.items() if k not in ("status",)}
              ch.update((json.dumps(canonical, sort_keys=True, ensure_ascii=False) + "\n").encode())
          computed_c = ch.hexdigest()
          expected_c = manifest["dataset_hash"]
          if computed_c != expected_c:
              print(f"FAIL: canonical SHA-256 mismatch\n  computed={computed_c}\n  expected={expected_c}")
              sys.exit(1)

          print("PASS: Golden Pilot hashes verified")
          print(f"  Vocabulary file SHA-256 : {computed_file}")
          print(f"  Canonical SHA-256       : {computed_c}")

          # ── Golden Pilot v1.1 Check ─────────────────────────────────────────
          manifest_path_1_1 = base / "data/releases/golden-pilot-v1.1/dataset_manifest.json"
          vocab_path_1_1    = base / "data/releases/golden-pilot-v1.1/vocabulary.jsonl"
          if manifest_path_1_1.exists() and vocab_path_1_1.exists():
              with open(manifest_path_1_1) as f:
                  m11 = json.load(f)
              h11 = hashlib.sha256()
              with open(vocab_path_1_1, "rb") as f:
                  for chunk in iter(lambda: f.read(65536), b""):
                      h11.update(chunk)
              f11 = h11.hexdigest()
              if f11 != m11["vocabulary_file_sha256"]:
                  print(f"FAIL: v1.1 file SHA-256 mismatch\n  computed={f11}\n  expected={m11['vocabulary_file_sha256']}")
                  sys.exit(1)
              recs11 = [json.loads(l) for l in open(vocab_path_1_1) if l.strip()]
              s_recs11 = sorted(recs11, key=lambda r: r.get("id", ""))
              c11 = hashlib.sha256()
              for r in s_recs11:
                  can = {k: v for k, v in r.items() if k not in ("status",)}
                  c11.update((json.dumps(can, sort_keys=True, ensure_ascii=False) + "\n").encode())
              can11 = c11.hexdigest()
              if can11 != m11["dataset_hash"]:
                  print(f"FAIL: v1.1 canonical SHA-256 mismatch\n  computed={can11}\n  expected={m11['dataset_hash']}")
                  sys.exit(1)
              print("PASS: Golden Pilot v1.1 hashes verified")
              print(f"  Vocabulary file SHA-256 : {f11}")
              print(f"  Canonical SHA-256       : {can11}")
          EOF
